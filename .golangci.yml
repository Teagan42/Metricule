version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars

  settings:
    errcheck:
      # Diagnostic writes to stdout/stderr have no recovery path; a failed write
      # to a closed pipe must not mask the error being reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: indent-error-flow
    gosec:
      excludes:
        # Subprocess invocation is inherent to process-level CLI tests.
        - G204

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
