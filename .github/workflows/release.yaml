name: Release

# Release-please owns tag creation and release notes. This workflow only builds
# and attaches artifacts to a release that already exists.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of an existing release, such as v0.1.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, such as v0.1.0.
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CGO_ENABLED: 0
  GO_VERSION: "1.27"

jobs:
  binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          make build VERSION="${{ inputs.tag }}" COMMIT="${GITHUB_SHA::7}"
          mv bin/metricule "metricule-${GOOS}-${GOARCH}"

      - name: Checksum
        run: sha256sum metricule-* > metricule-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: metricule-*

  image:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # GHCR rejects uppercase paths and the owner is "Teagan42".
      - name: Resolve image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from the input, not github.ref: a reusable call from main runs
      # with refs/heads/main and semver patterns would not resolve.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true

      # Lets consumers verify the image came from this repository's workflow.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: metricule.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: metricule.spdx.json

  attach:
    name: Attach release assets
    runs-on: ubuntu-latest
    needs: [binaries, image, sbom]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'metricule-*' -o -name '*.spdx.json' \) \
            -exec cp {} release/ \;
          cp schemas/v1alpha1.schema.json release/
          ls -l release

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" release/* --clobber
