name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CGO_ENABLED: 0
  GO_VERSION: "1.27"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          make build VERSION=${GITHUB_REF_NAME} COMMIT=${GITHUB_SHA::7}
          mv bin/metricule metricule-${GOOS}-${GOARCH}

      - name: Checksum
        run: sha256sum metricule-* > metricule-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            metricule-*
            !*.sha256.tmp

  image:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true

      # Lets consumers verify the image came from this repository's workflow.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: metricule.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: metricule.spdx.json

  publish:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [binaries, image, sbom]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'metricule-*' -o -name '*.spdx.json' \) \
            -exec cp {} release/ \;
          cp schemas/v1alpha1.schema.json release/
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
