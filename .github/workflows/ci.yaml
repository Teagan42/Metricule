name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # §4.3 forbids a CGO requirement in the default release.
  CGO_ENABLED: 0
  GO_VERSION: "1.27"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Built from source with the runner's Go rather than downloaded as a binary.
      # A prebuilt linter can only decode stdlib export data from the Go release it
      # was built with, so a patch bump to the toolchain breaks a pinned binary
      # ("export data version 5 is greater than maximum supported version 4").
      # Compiling it here keeps the linter and the code on one toolchain.
      #
      # Version stays pinned, not `latest`: linter upgrades should be deliberate.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          install-mode: goinstall

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The race detector requires cgo, which is why this job overrides the
      # workflow-level CGO_ENABLED rather than inheriting it.
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # §AD-015: the binary must work outside a container.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/metricule

  examples:
    name: Validate example configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # §23 requires every documented example to be exercised by CI.
      - name: Validate examples
        run: make validate-examples

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
