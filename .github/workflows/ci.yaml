name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # §4.3 forbids a CGO requirement in the default release.
  CGO_ENABLED: 0
  GO_VERSION: "1.27"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Pinned, not `latest`: action v6 resolves `latest` to golangci-lint v1.x,
      # which cannot read a version "2" config.
      #
      # v2.15.0 is the floor for Go 1.27.3. The linter's vendored x/tools decodes
      # stdlib export data, and that ceiling moves with x/tools, not with the Go
      # used to build the linter: v0.49.0 (golangci-lint v2.13.1) knows pkgbits
      # V0-V4, while Go 1.27.3 emits V5. v2.15.0 vendors x/tools v0.52.0, which
      # added V5. Bump this pin before bumping GO_VERSION.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The race detector requires cgo, which is why this job overrides the
      # workflow-level CGO_ENABLED rather than inheriting it.
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # §AD-015: the binary must work outside a container.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/metricule

  examples:
    name: Validate example configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # §23 requires every documented example to be exercised by CI.
      - name: Validate examples
        run: make validate-examples

      - name: Validate Compose examples
        run: make validate-compose

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
