# The configured metric budget is compared against the metrics array length (§8.7).
apiVersion: metricule.io/v1alpha1
kind: Exporter
defaults:
  limits:
    max_metrics: 1
sources:
  db:
    type: sqlite
    path: /data/app.db
metrics:
  - name: app_users
    help: Current user population
    type: gauge
    source: db
    query:
      sql: SELECT COUNT(*) AS value FROM users
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s
  - name: app_sessions
    help: Current sessions
    type: gauge
    source: db
    query:
      sql: SELECT COUNT(*) AS value FROM sessions
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s
