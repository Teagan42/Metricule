# Selector syntax is checked by internal/selector, not by the schema's string type.
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  api:
    type: http
    base_url: http://app:8080
metrics:
  - name: app_sessions_active
    help: Active sessions
    type: gauge
    source: api
    request:
      path: /api/status
    mapping:
      value: "$.["
    collect:
      mode: poll
      interval: 30s
