# A label cannot be both extracted and static: the two values would conflict.
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  db:
    type: sqlite
    path: /data/app.db
metrics:
  - name: app_sessions
    help: Sessions by tier
    type: gauge
    source: db
    query:
      sql: SELECT tier, COUNT(*) AS value FROM sessions GROUP BY tier
    mapping:
      value: value
      labels:
        tier: tier
      static_labels:
        tier: primary
    collect:
      mode: poll
      interval: 30s
