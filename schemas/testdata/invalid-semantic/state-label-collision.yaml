# The state label is generated for state_set metrics and cannot be user-assigned.
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  db:
    type: sqlite
    path: /data/app.db
metrics:
  - name: app_service_state
    help: Service state
    type: state_set
    source: db
    query:
      sql: SELECT state AS value FROM status
    mapping:
      value: value
      labels:
        state: value
      states:
        - up
        - down
    collect:
      mode: poll
      interval: 30s
