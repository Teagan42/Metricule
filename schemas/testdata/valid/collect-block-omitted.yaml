# `collect` is optional: Go defaults the block to poll with the inherited interval, so
# the schema must not require it (ADR 0007).
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  db:
    type: sqlite
    path: /data/app.db
metrics:
  - name: app_users
    help: Current user population
    type: gauge
    source: db
    query:
      sql: SELECT COUNT(*) AS value FROM users
    mapping:
      value: value
