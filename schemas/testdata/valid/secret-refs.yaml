# All three secret reference forms (§5.3). Offline validation never resolves them.
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  from_env:
    type: postgres
    dsn:
      env: APP_DATABASE_URL
  from_file:
    type: postgres
    dsn:
      file: /run/secrets/app_database_url
  literal_dev_only:
    type: http
    base_url: https://app.internal
    authentication:
      type: basic
      username: metrics
      password:
        value: development-only
metrics:
  - name: app_rows_env
    help: Row count via an environment DSN
    type: gauge
    source: from_env
    query:
      sql: SELECT COUNT(*) AS value FROM things
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s

  - name: app_rows_file
    help: Row count via a file DSN
    type: gauge
    source: from_file
    query:
      sql: SELECT COUNT(*) AS value FROM things
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s

  - name: app_literal_probe
    help: Probe using a literal development credential
    type: gauge
    source: literal_dev_only
    request:
      path: /healthz
    mapping:
      value: "$.ok"
    collect:
      mode: poll
      interval: 30s
