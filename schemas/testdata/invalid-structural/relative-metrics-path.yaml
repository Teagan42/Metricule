# Exposition paths are absolute.
apiVersion: metricule.io/v1alpha1
kind: Exporter
server:
  metrics_path: metrics
sources:
  db:
    type: sqlite
    path: /data/app.db
metrics:
  - name: app_thing
    help: A thing
    type: gauge
    source: db
    query:
      sql: SELECT 1 AS value
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s
