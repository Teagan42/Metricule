# ADR 0007 direction break: Go accepts this and forces readonly back to true; the
# schema's `const: true` rejects it. See internal/config/gaps_test.go.
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  db:
    type: sqlite
    path: /data/app.db
    readonly: false
metrics:
  - name: app_users
    help: Current user population
    type: gauge
    source: db
    query:
      sql: SELECT COUNT(*) AS value FROM users
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s
