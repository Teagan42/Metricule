# Only GET is supported in v0.1 (§11.1).
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  api:
    type: http
    base_url: http://app:8080
metrics:
  - name: app_thing
    help: A thing
    type: gauge
    source: api
    request:
      method: POST
      path: /status
    mapping:
      value: "$.value"
    collect:
      mode: poll
      interval: 30s
