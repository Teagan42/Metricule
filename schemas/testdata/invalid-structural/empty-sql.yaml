# An empty query cannot produce a sample.
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  db:
    type: sqlite
    path: /data/app.db
metrics:
  - name: app_thing
    help: A thing
    type: gauge
    source: db
    query:
      sql: ""
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s
