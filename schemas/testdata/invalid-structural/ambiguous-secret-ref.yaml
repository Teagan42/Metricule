# Exactly one of value, env, or file (§5.3).
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  pg:
    type: postgres
    dsn:
      env: APP_DATABASE_URL
      file: /run/secrets/app_database_url
metrics:
  - name: app_thing
    help: A thing
    type: gauge
    source: pg
    query:
      sql: SELECT 1 AS value
    mapping:
      value: value
    collect:
      mode: poll
      interval: 30s
