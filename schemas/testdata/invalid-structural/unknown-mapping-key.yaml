# The mapping block has a hand-written unmarshaler; it still rejects unknown keys.
apiVersion: metricule.io/v1alpha1
kind: Exporter
sources:
  db:
    type: sqlite
    path: /data/app.db
metrics:
  - name: app_thing
    help: A thing
    type: gauge
    source: db
    query:
      sql: SELECT 1 AS value
    mapping:
      value: value
      aggregate: sum
    collect:
      mode: poll
      interval: 30s
