# Sonarr: a Varken replacement built on the HTTP/JSON adapter.
#
# Sonarr rejects Authorization, so the key rides X-Api-Key (type: api_key).
#
# Queue and wanted totals come from endpoints that return a server-side total
# (`totalCount`, `totalRecords`), so no pagination is needed and `pageSize: "1"`
# keeps the response small. Varken paginated the full queue only to count it.
apiVersion: metricule.io/v1alpha1
kind: Exporter

metadata:
  name: sonarr
  description: Sonarr queue, wanted, health, calendar, and disk metrics

server:
  listen: "0.0.0.0:9709"

defaults:
  collection:
    interval: 60s
    timeout: 15s
    jitter: 5s
  limits:
    max_series_per_metric: 500
    max_rows_per_query: 2000

sources:
  sonarr:
    type: http
    base_url: http://sonarr:8989
    timeout: 15s
    authentication:
      type: api_key
      header: X-Api-Key
      token:
        env: SONARR_API_KEY
    allowed_paths:
      - /api/v3/queue
      - /api/v3/queue/status
      - /api/v3/wanted/missing
      - /api/v3/wanted/cutoff
      - /api/v3/health
      - /api/v3/diskspace
      - /api/v3/calendar
    max_response_bytes: 8388608
    # A redirect would carry X-Api-Key to another origin.
    max_redirects: 0
    retries: 2

metrics:
  # --- Queue totals ---------------------------------------------------------

  - name: sonarr_queue_items
    help: Items in the Sonarr download queue, including unknown-series items
    type: gauge
    source: sonarr
    request:
      path: /api/v3/queue/status
    mapping:
      value: "$.totalCount"
    collect:
      mode: poll
      interval: 60s

  - name: sonarr_queue_items_unknown
    help: Queue items Sonarr cannot match to a series
    type: gauge
    source: sonarr
    request:
      path: /api/v3/queue/status
    mapping:
      value: "$.unknownCount"
    collect:
      mode: poll
      interval: 60s

  # Sonarr reports these as booleans, not counts; they map to 0 or 1.
  - name: sonarr_queue_errored
    help: Whether any queue item is in an error state
    type: gauge
    source: sonarr
    request:
      path: /api/v3/queue/status
    mapping:
      value: "$.errors"
    collect:
      mode: poll
      interval: 60s

  - name: sonarr_queue_warned
    help: Whether any queue item is in a warning state
    type: gauge
    source: sonarr
    request:
      path: /api/v3/queue/status
    mapping:
      value: "$.warnings"
    collect:
      mode: poll
      interval: 60s

  # --- Wanted ---------------------------------------------------------------

  - name: sonarr_wanted_missing_episodes
    help: Monitored episodes that have aired and have no file
    type: gauge
    source: sonarr
    request:
      path: /api/v3/wanted/missing
      params:
        pageSize: "1"
    mapping:
      value: "$.totalRecords"
    collect:
      mode: poll
      interval: 5m

  - name: sonarr_wanted_cutoff_unmet_episodes
    help: Monitored episodes whose quality cutoff is unmet
    type: gauge
    source: sonarr
    request:
      path: /api/v3/wanted/cutoff
      params:
        pageSize: "1"
    mapping:
      value: "$.totalRecords"
    collect:
      mode: poll
      interval: 5m

  # --- Per-item queue detail ------------------------------------------------
  #
  # One series per queue item, replacing Varken's per-item points. Label
  # cardinality follows queue depth, so max_series_per_metric caps it; drop
  # these two metrics if you only alert on the totals above.
  #
  # includeUnknownSeriesItems is false because a label selector must resolve on
  # every row: an unknown-series item has `"series": null`, and `null: omit`
  # covers the value only, so one such item fails the whole collection.
  # sonarr_queue_items_unknown counts them instead.

  - name: sonarr_queue_item_size_bytes
    help: Total size of a queued Sonarr download
    type: gauge
    source: sonarr
    request:
      path: /api/v3/queue
      params:
        pageSize: "200"
        includeSeries: "true"
        includeUnknownSeriesItems: "false"
    mapping:
      rows: "$.records[*]"
      value: "$.size"
      labels:
        series: "$.series.title"
        release: "$.title"
        season: "$.seasonNumber"
        protocol: "$.protocol"
        quality: "$.quality.quality.name"
        status: "$.status"
        tracked_status: "$.trackedDownloadStatus"
        tracked_state: "$.trackedDownloadState"
    collect:
      mode: poll
      interval: 60s
    limits:
      max_series_per_metric: 200

  - name: sonarr_queue_item_remaining_bytes
    help: Bytes still to download for a queued Sonarr item
    type: gauge
    source: sonarr
    request:
      path: /api/v3/queue
      params:
        pageSize: "200"
        includeSeries: "true"
        includeUnknownSeriesItems: "false"
    mapping:
      rows: "$.records[*]"
      value: "$.sizeleft"
      labels:
        series: "$.series.title"
        release: "$.title"
        season: "$.seasonNumber"
        protocol: "$.protocol"
        quality: "$.quality.quality.name"
    collect:
      mode: poll
      interval: 60s
    limits:
      max_series_per_metric: 200

  # --- Calendar -------------------------------------------------------------
  #
  # Replaces Varken's per-episode calendar points. Sonarr defaults the window to
  # today when start and end are omitted, which `params` cannot compute: static
  # values only, so no relative date range is expressible.

  - name: sonarr_calendar_episode_has_file
    help: Whether an episode in today's calendar window has a file on disk
    type: gauge
    source: sonarr
    request:
      path: /api/v3/calendar
      params:
        includeSeries: "true"
        unmonitored: "false"
    mapping:
      rows: "$[*]"
      value: "$.hasFile"
      labels:
        series: "$.series.title"
        episode: "$.title"
        season: "$.seasonNumber"
        number: "$.episodeNumber"
    collect:
      mode: poll
      interval: 10m
    limits:
      max_series_per_metric: 300

  # --- Health and disk ------------------------------------------------------

  - name: sonarr_health_issue
    help: Severity of each active Sonarr health check result
    type: state_set
    source: sonarr
    request:
      path: /api/v3/health
    mapping:
      rows: "$[*]"
      value: "$.type"
      labels:
        check: "$.source"
      states:
        - ok
        - notice
        - warning
        - error
    collect:
      mode: poll
      interval: 5m
    limits:
      max_series_per_metric: 200

  - name: sonarr_disk_free_bytes
    help: Free space on a root folder Sonarr reports
    type: gauge
    source: sonarr
    request:
      path: /api/v3/diskspace
    mapping:
      rows: "$[*]"
      value: "$.freeSpace"
      labels:
        path: "$.path"
    collect:
      mode: poll
      interval: 5m
    limits:
      max_series_per_metric: 50

  - name: sonarr_disk_total_bytes
    help: Total size of a root folder Sonarr reports
    type: gauge
    source: sonarr
    request:
      path: /api/v3/diskspace
    mapping:
      rows: "$[*]"
      value: "$.totalSpace"
      labels:
        path: "$.path"
    collect:
      mode: poll
      interval: 5m
    limits:
      max_series_per_metric: 50
