apiVersion: metricule.io/v1alpha1
kind: Exporter

server:
  listen: 0.0.0.0:9108

sources:
  app:
    type: sqlite
    path: /data/app.db
    readonly: true
    busy_timeout: 3s
    # data_version is database-wide, so any commit refreshes this plan.
    change_check_interval: 1s

metrics:
  - name: app_users
    help: Users recorded by the application
    type: gauge
    source: app
    query:
      sql: SELECT COUNT(*) AS value FROM users
    mapping:
      value: value
    collect:
      mode: auto
      fallback_interval: 60s
      watch:
        tables:
          - users
